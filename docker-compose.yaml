  services:
    app:
      build:
        context: ./app/
        dockerfile: Dockerfile
      environment:
        - SEARXNG_HOST=http://core:8080
      volumes:
        - "./app/:/app/"
        - "./chat-ui/:/chat-ui/"
      container_name: agent-app
      depends_on:
        - core
      extra_hosts:
      - "host.docker.internal:host-gateway"

    frontend:
      build: 
        context: ./chat-ui/
        dockerfile: Dockerfile
      volumes:
        - "./chat-ui/:/app/"
      command: "npm run dev"
      ports:
        - "8000:3000"

    core:
      container_name: searxng-core
      image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
      restart: always
      ports:
        - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
      env_file: ./searxng/.env
      volumes:
        - ./searxng/core-config/:/etc/searxng/:Z
        - ./searxng/core-data:/var/cache/searxng/

    valkey:
      container_name: searxng-valkey
      image: docker.io/valkey/valkey:9-alpine
      command: valkey-server --save 30 1 --loglevel warning
      restart: always
      volumes:
        - ./searxng/valkey-data:/data/

  volumes:
    core-data:
    valkey-data:
